<!doctype html>
<!-- PROTOTYPE 2 — throwaway. B-family: triage queue + Overview tab, three flow-diagram renderers via ?variant=b1|b2|b3. b3 loads mermaid from CDN (prototype only — 3.5MB, not shippable offline). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE 2 — queue + overview + diagrams</title>
<style>
:root{color-scheme:light dark;--fg:#16181d;--muted:#5b6470;--bg:#fff;--panel:#f6f8fa;--line:#dfe3e8;--hl:#fff4d6;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--high:#b42318;--med:#935705;--low:#175cd3;--r:8px;--accent:#175cd3}
@media(prefers-color-scheme:dark){:root{--fg:#e8eaf0;--muted:#9aa3b2;--bg:#13151a;--panel:#1b1e25;--line:#2c313b;--hl:#4a3f00}}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);margin:0;line-height:1.5;padding-bottom:90px}
button{font:inherit;cursor:pointer}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 7px;border-radius:99px;border:1px solid var(--line)}
.b-HIGH{color:var(--high);border-color:currentColor}.b-MEDIUM{color:var(--med);border-color:currentColor}.b-LOW{color:var(--low);border-color:currentColor}
.loc{font-family:var(--mono);font-size:12px;color:var(--muted)}
pre.code{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;margin:8px 0}
.top{border-bottom:1px solid var(--line);padding:10px 20px;background:var(--bg);position:sticky;top:0;z-index:5}
.top h1{font-size:15px;margin:0;display:inline}
.tabs{display:flex;gap:4px;margin-top:8px}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:var(--r) var(--r) 0 0;padding:6px 14px;border-bottom:0}
.tabs button.on{background:var(--bg);font-weight:700}
.ov{max-width:900px;margin:0 auto;padding:20px}
.ov .stats{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0;font-size:14px}
.ov .stats b{font-size:18px;display:block}
.ov ul.files{padding-left:18px;font-size:14px}.ov ul.files code{font-family:var(--mono);font-size:13px}
.diagram{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:16px 0;background:var(--bg);overflow-x:auto}
.diagram h3{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.diagram svg text{font-family:system-ui,sans-serif}
.dnode{cursor:pointer}.dnode rect{fill:var(--panel);stroke:var(--line)}.dnode.hot rect{stroke:var(--high);stroke-width:2}
.dnode text{fill:var(--fg)}
.q{display:grid;grid-template-columns:300px 1fr;min-height:60vh}
.queue{border-right:1px solid var(--line);padding:8px}
.qi{width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:var(--r);padding:8px;display:block;color:var(--fg)}
.qi:hover{background:var(--panel)}.qi.sel{background:var(--panel);border-color:var(--line)}
.qi .t{font-size:13.5px;font-weight:600;display:block}
.detail{padding:20px 28px;max-width:760px}.detail h2{margin:0 0 4px;font-size:19px}
.detail h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 4px}
.detail .opt{display:block;font-size:14px;margin:4px 0}
textarea.comment{width:100%;min-height:70px;font-family:var(--mono);font-size:13px;padding:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--fg);margin-top:8px}
.rowbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts{border-top:1px solid var(--line);padding:16px 28px;max-width:820px}
.acts h3{margin:0 0 4px}
#proto-bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#111;color:#fff;border-radius:99px;padding:8px;display:flex;gap:4px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:99;font-size:14px}
#proto-bar button{background:#333;color:#fff;border:0;border-radius:99px;padding:6px 12px}
#proto-bar .lbl{padding:0 10px;white-space:nowrap}#proto-bar .lbl small{opacity:.6}
#proto-state{position:fixed;left:16px;bottom:16px;background:#111;color:#bbb;border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:11px;z-index:99}
</style>
</head>
<body>
<div class="top"><h1 id="t"></h1> <span id="c"></span>
<div class="tabs"><button id="tab-ov">Overview</button><button id="tab-q">Findings (<span id="qn"></span>)</button></div></div>
<div id="app"></div>
<div id="proto-bar"><button id="p-prev">←</button><span class="lbl" id="p-label"></span><button id="p-next">→</button></div>
<div id="proto-state"></div>
<script type="application/json" id="review-data">
{"schema_version":"1.0","review":{"mode":"pull_request","repository":"acme/auth","pull_request":183,"pr_title":"Add session refresh","pr_author":"kedarmd","base_ref":"main","head_ref":"feature/session-refresh","base_sha":"a1b2c3d","head_sha":"e4f5g6h","generated_at":"2026-10-02"},"summary":{"critical":0,"high":1,"medium":2,"low":1},"overview":{"summary":"Adds a POST /sessions/refresh endpoint so clients can extend a session without re-login. The handler delegates to AuthService.refreshSession, which reloads the row from the session store, extends expiresAt by a fixed 30-minute TTL, and saves it back. No schema migration; three files touched.","stats":{"files":3,"additions":84,"deletions":11,"commits":2},"key_files":[{"file":"src/api/session.ts","why":"new endpoint + request validation"},{"file":"src/auth/session.ts","why":"refresh logic — both HIGH/MEDIUM findings live here"},{"file":"src/db/sessions.ts","why":"store reads/writes, no migration needed"}]},"flow":[{"id":"req","label":"POST /sessions/refresh","locations":[{"file":"src/api/session.ts","start_line":20,"end_line":34}],"finding_ids":[]},{"id":"svc","label":"AuthService.refreshSession","locations":[{"file":"src/auth/session.ts","start_line":70,"end_line":78}],"finding_ids":["F-001","F-004"]},{"id":"store","label":"Session store","locations":[{"file":"src/db/sessions.ts","start_line":10,"end_line":22}],"finding_ids":["F-002"]}],"findings":[{"id":"F-001","severity":"HIGH","status":"new","title":"Session expiry is not validated on refresh","summary":"The refresh path accepts an already-expired session and extends it.","locations":[{"file":"src/auth/session.ts","start_line":70,"end_line":78}],"reason":"refreshSession writes a new expiresAt without checking whether the session already expired.","impact":"A stolen or stale token can be revived indefinitely.","evidence":"No expiresAt comparison on the refresh path.","code_excerpt":"70  refreshSession(sessionId) {\n71    const s = getSession(sessionId);\n72    if (!s) throw new AuthError();\n75    s.expiresAt = Date.now() + 30*60*1000;\n76    saveSession(s);","confidence":0.93,"suggestions":[{"id":"S-001","title":"Reject expired sessions","comment":"Reject already-expired sessions instead of extending them.","code":"if (s.expiresAt < Date.now()) throw new AuthError();"}]},{"id":"F-002","severity":"MEDIUM","status":"new","title":"Refresh token reuse is not detected","summary":"A used refresh token can be replayed within its window.","locations":[{"file":"src/auth/refresh.ts","start_line":40,"end_line":55}],"reason":"Rotation issues a new token but never marks the old one consumed.","impact":"Token theft is harder to notice.","evidence":"No jti blocklist write on the rotation path.","code_excerpt":"40  rotate(t) {\n41    const tok = verify(t);\n42    return issue(tok.sub);\n43  }","confidence":0.81,"suggestions":[]},{"id":"F-003","severity":"MEDIUM","status":"unresolved","title":"Error swallowed in session cleanup","summary":"Cleanup failures are silently ignored.","locations":[{"file":"src/auth/session.ts","start_line":120,"end_line":128}],"reason":"Empty catch around deleteExpiredSessions hides store errors.","impact":"A failing store looks healthy; expired rows accumulate.","evidence":"Empty catch block, on the touched path.","code_excerpt":"120 try {\n121   deleteExpiredSessions();\n122 } catch (e) {\n123   // ignore\n124 }","confidence":0.74,"suggestions":[]},{"id":"F-004","severity":"LOW","status":"new","title":"Magic number for session TTL","summary":"The 30-minute TTL is a bare literal.","locations":[{"file":"src/auth/session.ts","start_line":74,"end_line":74}],"reason":"Inline 60 * 30 with no named constant.","impact":"Minor: policy changes need code hunts.","evidence":"Line 74; no SESSION_TTL constant in module.","code_excerpt":"74    const ttl = 60 * 30;","confidence":0.88,"suggestions":[]}]}
</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
(function(){
var DATA=JSON.parse(document.getElementById("review-data").textContent);
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function codeBlock(ex){return "<pre class='code'>"+esc(ex||"")+"</pre>"}
function counts(){var s=DATA.summary;return ["HIGH","MEDIUM","LOW"].map(function(k){return "<span class='badge b-"+k+"'>"+k+" "+(s[k.toLowerCase()]||0)+"</span>"}).join(" ")}
var tab="ov", selId=null;
function findings(){return DATA.findings||[]}
function byId(id){return findings().filter(function(f){return f.id===id})[0]}
/* ----- shared overview (summary + stats + key files) ----- */
function overviewHTML(){var r=DATA.review,o=DATA.overview;
return "<div class='ov'><h2>What changed</h2><p>"+esc(o.summary)+"</p>"
+"<div class='stats'><div><b>"+o.stats.files+"</b>files</div><div><b>+"+o.stats.additions+"</b>additions</div><div><b>−"+o.stats.deletions+"</b>deletions</div><div><b>"+o.stats.commits+"</b>commits</div></div>"
+"<h2>Key files</h2><ul class='files'>"+o.key_files.map(function(k){return "<li><code>"+esc(k.file)+"</code> — "+esc(k.why)+"</li>"}).join("")+"</ul>"
+"<div class='diagram'><h3>Change flow — click a node to jump to its findings</h3><div id='diagram'></div></div></div>"}
/* ----- diagram b1: SVG pipeline ----- */
function drawPipeline(){var nodes=DATA.flow,W=200,H=70,G=60;var total=nodes.length*W+(nodes.length-1)*G;
var s="<svg width='"+total+"' height='110' role='img'>";
nodes.forEach(function(n,i){var x=i*(W+G);var hot=(n.finding_ids||[]).length>0;
s+="<g class='dnode"+(hot?" hot":"")+"' data-n='"+i+"'><rect x='"+x+"' y='10' width='"+W+"' height='"+H+"' rx='8'/>"
+"<text x='"+(x+12)+"' y='34' font-size='13' font-weight='600'>"+esc(n.label.length>26?n.label.slice(0,25)+"…":n.label)+"</text>"
+"<text x='"+(x+12)+"' y='52' font-size='11' fill='#888'>"+esc((n.locations[0]||{}).file||"")+"</text>"
+((n.finding_ids||[]).length?"<text x='"+(x+12)+"' y='68' font-size='11' fill='#b42318'>"+esc(n.finding_ids.join(", "))+"</text>":"")+"</g>";
if(i<nodes.length-1)s+="<line x1='"+(x+W)+"' y1='45' x2='"+(x+W+G)+"' y2='45' stroke='#888' stroke-width='2'/><polygon points='"+(x+W+G-8)+",39 "+(x+W+G-8)+",51 "+(x+W+G)+",45' fill='#888'/>";});
document.getElementById("diagram").innerHTML=s+"</svg>";
document.querySelectorAll(".dnode").forEach(function(g){g.addEventListener("click",function(){var n=nodes[+g.getAttribute("data-n")];var ids=n.finding_ids||[];if(ids.length){showTab("q");select(ids[0])}})});}
/* ----- diagram b2: SVG sequence ----- */
var SEQ={actors:["Client","API","AuthService","Store"],msgs:[
{from:0,to:1,label:"POST /sessions/refresh"},
{from:1,to:2,label:"refreshSession(id)"},
{from:2,to:3,label:"getSession(id)"},
{from:3,to:2,label:"row"},
{from:2,to:3,label:"saveSession(+30m)",finding:"F-001"},
{from:2,to:1,label:"session"},
{from:1,to:3,label:"rotate(token)",finding:"F-002"}]};
function drawSequence(){var A=SEQ.actors,X0=90,DX=170,W=X0+DX*(A.length-1)+60,H=60+SEQ.msgs.length*44;
var s="<svg width='"+W+"' height='"+H+"' role='img'>";
A.forEach(function(a,i){var x=X0+i*DX;s+="<rect x='"+(x-55)+"' y='8' width='110' height='30' rx='6' fill='none' stroke='#888'/><text x='"+x+"' y='28' font-size='12' text-anchor='middle'>"+a+"</text><line x1='"+x+"' y1='38' x2='"+x+"' y2='"+(H-8)+"' stroke='#aaa' stroke-dasharray='5 4'/>";});
SEQ.msgs.forEach(function(m,i){var y=64+i*44;var x1=X0+m.from*DX,x2=X0+m.to*DX;var l=Math.min(x1,x2),r=Math.max(x1,x2);var fwd=x2>x1;
var col=m.finding?"#b42318":"#175cd3";
s+="<line x1='"+l+"' y1='"+y+"' x2='"+r+"' y2='"+y+"' stroke='"+col+"' stroke-width='"+(m.finding?2.5:1.5)+"'/>"
+"<polygon points='"+(fwd?(r-9)+","+ (y-5)+" "+(r-9)+","+(y+5)+" "+r+","+y:(l+9)+","+(y-5)+" "+(l+9)+","+(y+5)+" "+l+","+y)+"' fill='"+col+"'/>"
+"<text x='"+((l+r)/2)+"' y='"+(y-6)+"' font-size='11' text-anchor='middle' fill='"+col+"'>"+(i+1)+". "+esc(m.label)+(m.finding?" ["+m.finding+"]":"")+"</text>";
if(m.finding)s+="<circle class='dnode' data-f='"+m.finding+"' cx='"+((l+r)/2)+"' cy='"+y+"' r='14' fill='transparent'/>";});
document.getElementById("diagram").innerHTML=s+"</svg>";
document.querySelectorAll(".dnode[data-f]").forEach(function(c){c.addEventListener("click",function(){showTab("q");select(c.getAttribute("data-f"))})});}
/* ----- diagram b3: mermaid ----- */
function drawMermaid(){var box=document.getElementById("diagram");var nodes=DATA.flow;
var def="flowchart LR\n"+nodes.map(function(n,i){var sub=((n.locations[0]||{}).file||"")+((n.finding_ids||[]).length?"<br/>"+n.finding_ids.join(", "):"");
return "  n"+i+"[\""+n.label+"<br/><small>"+sub+"</small>\"]"}).join("\n")+"\n"+nodes.map(function(n,i){return i?"  n"+(i-1)+" --> n"+i:""}).filter(Boolean).join("\n");
try{if(!window.mermaid)throw new Error("mermaid failed to load (offline?)");
mermaid.initialize({startOnLoad:false,securityLevel:"loose"});
var mid="mmd"+(++window.__mmdN||(window.__mmdN=1));
mermaid.render(mid,def).then(function(res){box.innerHTML=res.svg}).catch(function(e){box.textContent="Mermaid render failed: "+e.message});
}catch(e){box.innerHTML="<p><b>Prototype note:</b> "+esc(e.message)+". The mermaid variant needs network in this prototype; the SVG variants (b1/b2) work offline.</p><pre>"+esc(def)+"</pre>"}}
/* ----- queue tab ----- */
function queueHTML(){var order={CRITICAL:0,HIGH:1,MEDIUM:2,LOW:3};var fs=findings().slice().sort(function(a,b){return order[a.severity]-order[b.severity]});
return "<div class='q'><div class='queue'>"+["HIGH","MEDIUM","LOW"].map(function(s){var g=fs.filter(function(f){return f.severity===s});if(!g.length)return "";return "<div class='loc' style='padding:8px 8px 2px'>"+s+"</div>"+g.map(function(f){return "<button class='qi"+(f.id===selId?" sel":"")+"' data-f='"+f.id+"'><span class='t'>"+esc(f.title)+"</span><span class='loc'>"+esc(f.locations[0].file)+":"+f.locations[0].start_line+"</span></button>"}).join("")}).join("")+"</div><div class='detail' id='det'></div></div>"+actsHTML()+""}
function actsHTML(){return "<div class='acts'><h3>Review actions</h3><p class='loc'>Prototype: the browser never calls GitHub — the agent executes this payload via gh.</p><div class='rowbtns'><button id='a-submit'>Submit comments</button><button id='a-approve'>Approve</button><button id='a-req'>Request changes</button><button id='a-copy'>Copy payload</button></div><pre class='code' id='a-prev'></pre></div>"}
var payload={action:"submit_comments",repo:DATA.review.repository,pr:DATA.review.pull_request,commit_sha:DATA.review.head_sha,comments:[],body:""};
function renderPayload(){var p=document.getElementById("a-prev");if(p)p.textContent=JSON.stringify(payload);state()}
function wireActions(){var m={"a-submit":"submit_comments","a-approve":"approve","a-req":"request_changes"};Object.keys(m).forEach(function(id){var b=document.getElementById(id);if(b)b.onclick=function(){payload.action=m[id];renderPayload()}});var c=document.getElementById("a-copy");if(c)c.onclick=function(){renderPayload();if(navigator.clipboard)navigator.clipboard.writeText(JSON.stringify(payload))};renderPayload()}
function paintDetail(){var f=byId(selId)||findings()[0];if(!f)return;selId=f.id;var det=document.getElementById("det");if(!det)return;
det.innerHTML="<h2>"+esc(f.title)+"</h2><div><span class='badge b-"+f.severity+"'>"+f.severity+"</span> <span class='loc'>"+esc(f.locations[0].file)+":"+f.locations[0].start_line+"–"+f.locations[0].end_line+" · "+esc(f.status)+"</span></div><p>"+esc(f.summary)+"</p>"
+codeBlock(f.code_excerpt)+"<h4>Why</h4><p>"+esc(f.reason)+"</p><h4>Impact</h4><p>"+esc(f.impact)+"</p>"
+((f.suggestions||[]).length?"<h4>Suggested fixes</h4>"+f.suggestions.map(function(sg,i){return "<label class='opt'><input type='radio' name='sug' value='"+sg.id+"'"+(i===0?" checked":"")+"> <b>"+esc(sg.title)+"</b> — "+esc(sg.comment)+"</label>"}).join(""):"")
+"<div class='rowbtns'><button id='d-add'>Add comment</button><button id='d-drop'>Discard</button></div><textarea class='comment' id='d-ta'></textarea>";
var ta=document.getElementById("d-ta");var first=(f.suggestions||[])[0];if(ta&&first)ta.value=first.comment||"";
Array.prototype.forEach.call(det.querySelectorAll("input[name=sug]"),function(radio){radio.onchange=function(){var s=(f.suggestions||[]).filter(function(x){return x.id===radio.value})[0];if(s&&ta)ta.value=s.comment||""}});
var add=document.getElementById("d-add");if(add)add.onclick=function(){payload.comments=payload.comments.filter(function(c){return c.finding!==f.id});var l=(f.locations||[])[0]||{};payload.comments.push({finding:f.id,file:l.file,line:l.end_line||l.start_line,body:ta?ta.value:""});renderPayload()};
var drop=document.getElementById("d-drop");if(drop)drop.onclick=function(){payload.comments=payload.comments.filter(function(c){return c.finding!==f.id});renderPayload()};
document.querySelectorAll(".qi").forEach(function(b){b.classList.toggle("sel",b.getAttribute("data-f")===selId)})}
function select(id){selId=id;paintDetail();state()}
/* ----- variant wiring ----- */
var DRAW={b1:drawPipeline,b2:drawSequence,b3:drawMermaid};
var NAMES={b1:"Queue + SVG pipeline",b2:"Queue + SVG sequence",b3:"Queue + Mermaid (CDN)"};
var keys=Object.keys(NAMES);
var cur=(new URLSearchParams(location.search).get("variant")||"b1");if(!DRAW[cur])cur="b1";
function showTab(t){tab=t;document.getElementById("tab-ov").classList.toggle("on",t==="ov");document.getElementById("tab-q").classList.toggle("on",t==="q");
var app=document.getElementById("app");
if(t==="ov"){app.innerHTML=overviewHTML();DRAW[cur]()}else{app.innerHTML=queueHTML();paintDetail();wireActions()}state()}
function state(){var extra=tab==="q"&&selId?selId:tab;document.getElementById("proto-state").textContent="variant="+cur+" tab="+tab+(extra&&tab==="q"?" sel="+extra:"")+" payload="+payload.action+":"+payload.comments.length}
function show(k){cur=k;try{history.replaceState(null,"","?variant="+k)}catch(e){}document.getElementById("p-label").innerHTML="<b>"+k.toUpperCase()+"</b> — "+NAMES[k]+" <small>prototype</small>";showTab(tab)}
document.getElementById("tab-ov").onclick=function(){showTab("ov")};
document.getElementById("tab-q").onclick=function(){showTab("q")};
document.getElementById("p-prev").onclick=function(){show(keys[(keys.indexOf(cur)+keys.length-1)%keys.length])};
document.getElementById("p-next").onclick=function(){show(keys[(keys.indexOf(cur)+1)%keys.length])};
document.addEventListener("click",function(e){var b=e.target&&e.target.closest?e.target.closest(".qi"):null;if(b)select(b.getAttribute("data-f"))});
document.addEventListener("keydown",function(e){var t=e.target&&e.target.tagName;if(t==="INPUT"||t==="TEXTAREA")return;if(e.key==="ArrowLeft")document.getElementById("p-prev").click();if(e.key==="ArrowRight")document.getElementById("p-next").click()});
(function init(){var r=DATA.review;document.getElementById("t").textContent="PR #"+r.pull_request+" "+r.pr_title;document.getElementById("c").innerHTML=counts();document.getElementById("qn").textContent=findings().length;show(cur)})();
})();
</script>
</body>
</html>
