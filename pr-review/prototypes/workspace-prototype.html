ng-right:16px}.cols{grid-template-columns:minmax(0,1fr) 275px}.overview{grid-template-columns:1fr}.toolbar{margin-left:0}}@media(max-width:600px){.topin,.wrap{padding-left:12px;padding-right:12px}.topin{padding-top:13px}.wrap{padding-top:13px}h1{font-size:18px}.cols{grid-template-columns:1fr}.summary p{font-size:13px}.finding{padding:11px}.finding h3{font-size:12px}.phone-label{display:inline}.mobile-order{order:-1}.prototypebar span{min-width:185px}}

 minmax(0,1fr);gap:14px;align-items:start}.review-layout>.panel{min-width:0}.workspace-nav{padding:10px}.worktabs{display:flex;gap:4px;padding:6px;background:var(--soft);border-radius:7px;margin-bottom:10px}.worktab{flex:1}.detail-pane{padding:19px 22px;min-height:520px}.detail-pane h2{font-size:17px;margin:4px 0 6px}.detail-pane>p{font-size:12px;color:var(--muted);max-width:850px;margin:0 0 8px}.detail-pane .detailcode{margin:13px 0}.detail-pane .code{font-size:11px;padding:13px;line-height:1.9}.detail-pane .diffbox{margin-top:12px}.detail-pane .diffhead{font-size:11px;padding:10px 12px}.detail-pane .comment{font-size:12px}.detail-pane .comment p{font-size:12px}.detail-pane .suggestion{padding:13px;margin:13px 0}.detail-pane .compose{margin-top:14px}.file-summary{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line);font-size:12px}.file-summary code{font:11px var(--mono);overflow-wrap:anywhere}.source-note{font-size:11px;color:var(--muted);margin:12px 0 0}@media(max-width:850px){.review-layout{grid-template-columns:minmax(220px,270px) minmax(0,1fr)}.detail-pane{padding:16px}}@media(max-width:600px){.review-layout{grid-template-columns:1fr}.detail-pane{min-height:0;padding:14px}.review-layout .worktabs{margin-bottom:8px}}.maintabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:0 0 15px}.maintab{border:0;border-bottom:2px solid transparent;background:transparent;padding:10px 2px;color:var(--muted);font-size:12px}.maintab.active{border-color:var(--blue);color:var(--ink);font-weight:700}.overview-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(240px,1fr);gap:14px}.overview-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.overview-stat{padding:12px;border:1px solid var(--line);border-radius:7px}.overview-stat strong{display:block;font-size:17px}.overview-stat span{font-size:10px;color:var(--muted)}@media(max-width:600px){.overview-grid{grid-template-columns:1fr}.overview-stats{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><header class="top"><div class="topin"><div class="crumb">Acme / nebula · Pull request #482</div><h1>Keep session refresh inside the auth boundary</h1><div class="meta">#482 · mira-k wants to merge 3 commits into <code>main</code> from <code>fix/refresh-boundary</code></div><div class="statebar"><span class="pill open">● Open</span><span class="pill approved">✓ Approved</span><span class="pill">Updated 18 minutes ago</span><button id="refresh" class="toolbar">↻ Refresh</button></div></div></header><main id="app" class="wrap"></main><nav class="prototypebar"><button id="prev" aria-label="Previous">‹</button><span id="label"></span><button id="next" aria-label="Next">›</button></nav>
<script>
const variants=[['A','Review desk'],['B','Decision first'],['C','Conversation + workspace']];let variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants.some(v=>v[0]===variant))variant='A';let refreshState='Refreshed just now';
const summary=`Token refresh can run twice for concurrent requests. Keep refresh single flight per session to avoid invalidating the newest token.`;
const findings=`<section class="panel"><div class="head"><strong>Findings <span class="subhead">3 actionable</span></strong><span class="subhead">Standards · Spec</span></div><div class="body"><article class="finding"><span class="sev">HIGH</span><h3>Concurrent refreshes can invalidate the newest token</h3><p>Two requests can rotate the same session at once; the slower response may overwrite the newer token.</p><div class="loc">internal/auth/refresh.go:81 · Standards</div></article><article class="finding"><span class="sev med">MEDIUM</span><h3>Retry marker is cleared before the retry completes</h3><p>A second unauthorized response may enter the refresh path again.</p><div class="loc">internal/client/retry.go:125 · Spec</div></article><article class="finding"><span class="sev med">MEDIUM</span><h3>Expired event omits the affected account</h3><p>Consumers cannot identify which account needs attention.</p><div class="loc">internal/auth/session.go:60 · Standards</div></article></div></section>`;
const feedback=`<section class="panel"><div class="head"><strong>PR discussion</strong><span class="subhead">5 items</span></div><div class="discussion"><h4>Review summaries <span class="subhead">2</span></h4><div class="comment"><strong>jo-lee · Changes requested</strong><p>Please ensure concurrent requests share one refresh operation.</p></div><div class="comment"><strong>mira-k · Commented</strong><p>Added a per-session coordinator and regression coverage.</p></div></div><div class="discussion"><h4>Conversation <span class="subhead">1</span></h4><div class="comment"><strong>sam-r · 2 hours ago</strong><p>Does the coordinator survive a process restart?</p><div class="comment reply"><strong>mira-k · 1 hour ago</strong><p>It is request scoped; sessions resume through the store.</p></div></div></div><div class="discussion"><h4>Inline threads <span class="subhead">2</span></h4><div class="comment"><strong>jo-lee · refresh.go:81</strong><p>Could simultaneous requests race here?</p><div class="comment reply"><strong>mira-k · refresh.go:81</strong><p>Fixed with the session coordinator.</p></div></div><div class="resolved">▸ 1 resolved thread · retry.go:125 · hidden by default</div></div></section>`;
function A(){return `<p class="note">A — Two-column review desk: findings stay central; PR discussion and refresh context sit beside them.</p><section class="panel summary" style="margin-bottom:14px"><h2>Review summary</h2><p>${summary}</p></section><div class="cols">${findings}<div class="stack"><section class="panel"><div class="head"><strong>PR context</strong><span class="subhead">${refreshState}</span></div><div class="body"><div class="row"><span class="subhead">Lifecycle</span><span class="pill open">Open</span></div><div class="row" style="margin-top:9px"><span class="subhead">Review decision</span><span class="pill approved">Approved</span></div></div></section>${feedback}</div></div>`}
function B(){return `<p class="note">B — Decision first: a compact PR masthead and review synthesis lead; findings and discussion follow in a single scan.</p><div class="overview"><section class="panel summary"><h2>What this review found</h2><p>${summary}</p><div class="statebar"><span class="pill open">Open</span><span class="pill approved">Approved</span><span class="subhead">${refreshState}</span></div></section><section class="panel"><div class="head"><strong>Review activity</strong><span class="subhead">Latest first</span></div><div class="body"><div class="activity"><div class="avatar">JL</div><div><strong>jo-lee requested changes</strong><p>Today · 2 review comments</p></div></div><div class="activity"><div class="avatar">MK</div><div><strong>mira-k pushed 3 commits</strong><p>Today · latest update</p></div></div></div></section></div><div class="overview" style="margin-top:14px"><div>${findings}</div><div>${feedback}</div></div>`}
function C(){return `<p class="note">C — Overview remains a top-level tab; Changes and Findings are grouped inside Review.</p><div class="maintabs"><button class="maintab ${mainTab==='overview'?'active':''}" onclick="mainTab='overview';renderMainTab()">Overview</button><button class="maintab ${mainTab==='review'?'active':''}" onclick="mainTab='review';renderMainTab()">Review</button></div><div id="main-content"></div><div id="toast" class="toast"></div>`}
function renderMainTab(){document.querySelectorAll('.maintab').forEach((b,i)=>b.classList.toggle('active',(i===0&&mainTab==='overview')||(i===1&&mainTab==='review')));if(mainTab==='overview'){document.querySelector('#main-content').innerHTML=`<div class="overview-grid"><section class="panel summary"><h2>Review summary</h2><p>${summary}</p><div class="overview-stats" style="margin-top:14px"><div class="overview-stat"><strong>3</strong><span>commits</span></div><div class="overview-stat"><strong>6</strong><span>changed files</span></div><div class="overview-stat"><strong>3</strong><span>findings</span></div></div></section><div class="stack"><section class="panel"><div class="head"><strong>Pull request status</strong><span class="subhead">${refreshState}</span></div><div class="body"><div class="row"><span class="subhead">Lifecycle</span><span class="pill open">Open</span></div><div class="row" style="margin-top:9px"><span class="subhead">Review decision</span><span class="pill approved">Approved</span></div></div></section><section class="panel"><div class="head"><strong>Review context</strong><span class="subhead">Updated 18 minutes ago</span></div><div class="body"><p class="subhead" style="margin:0">Review summaries, conversation, and inline threads stay with their related findings or changed files in the Review tab.</p><button class="act" style="margin-top:10px" onclick="mainTab='review';renderMainTab()">Open review workspace</button></div></section></div></div>`}else{document.querySelector('#main-content').innerHTML=`<section class="panel summary" style="margin-bottom:14px"><h2>Review summary</h2><p>${summary}</p></section><div class="review-layout"><section class="panel"><div class="head"><strong>Review workspace</strong><span class="subhead">3 files · 3 findings</span></div><div id="workspace-nav" class="workspace-nav"></div></section><section class="panel" id="workspace-detail"></section></div><section class="panel" style="margin-top:14px"><div class="head"><strong>Submit review</strong><span class="subhead">PR-level actions</span></div><div class="body"><p class="subhead" style="margin:0 0 10px">Submit a review comment, approve the pull request, or request changes. Merge and close actions are available here too.</p><div class="actions"><button class="act" onclick="toast('PR review comment submitted in this prototype')">Submit comment</button><button class="act primary" onclick="toast('Pull request approved in this prototype')">Approve</button><button class="act" onclick="toast('Changes requested in this prototype')">Request changes</button><button class="act primary" onclick="toast('Merge confirmation shown in this prototype')">Merge pull request</button><button class="act" onclick="toast('Close confirmation shown in this prototype')">Close pull request</button></div></div></section>`;workspacePanel()}}
function C(){return `<p class="note">C — Overview remains a top-level tab; Changes and Findings are grouped inside Review.</p><div class="maintabs"><button class="maintab ${mainTab==='overview'?'active':''}" onclick="mainTab='overview';renderMainTab()">Overview</button><button class="maintab ${mainTab==='review'?'active':''}" onclick="mainTab='review';renderMainTab()">Review</button></div><div id="main-content"></div><div id="toast" class="toast"></div>`}
let mainTab='overview',workTab='changes',fileIndex=0,findingIndex=0;const files=[['internal/auth/refresh.go','+12 −4'],['internal/client/retry.go','+5 −2'],['internal/auth/session.go','+3 −1']];const findingData=[['HIGH','Concurrent refreshes can invalidate the newest token','internal/auth/refresh.go:81','Two requests can rotate the same session at once; the slower response may overwrite the newer token.'],['MEDIUM','Retry marker is cleared before the retry completes','internal/client/retry.go:125','A second unauthorized response may enter the refresh path again.'],['MEDIUM','Expired event omits the affected account','internal/auth/session.go:60','Consumers cannot identify which account needs attention.']];
function workspacePanel(){let file=files[fileIndex],f=findingData[findingIndex];let nav=`<div class="worktabs"><button class="worktab ${workTab==='changes'?'active':''}" onclick="workTab='changes';workspacePanel()">Changes <span class="subhead">6</span></button><button class="worktab ${workTab==='findings'?'active':''}" onclick="workTab='findings';workspacePanel()">Findings <span class="subhead">3</span></button></div>`;let rows='';let detail='';if(workTab==='changes'){rows=`<div class="subhead" style="margin:3px 0 8px">Changed files · 3</div>${files.map((x,i)=>`<button class="filepick ${i===fileIndex?'active':''}" onclick="fileIndex=${i};workspacePanel()">${x[0]}<small>${x[1]} · ${i===0?'1 finding':'1 finding'}</small></button>`).join('')}`;detail=`<div class="detail-pane"><div class="file-summary"><code>${file[0]}</code><span class="subhead">Modified · ${file[1]}</span></div><div class="diffbox"><div class="diffhead">Unified diff · refresh coordination</div><div class="code"><span class="context">  if (!session.refreshToken) return err</span><span class="del">- next := rotateToken(session)</span><span class="add">+ next := coordinator.Run(session.ID, rotateToken)</span><span class="context">  store.Save(next)</span><span class="add">+ emit("session:refreshed", next)</span><span class="context">  return next, nil</span></div></div><p class="source-note">Inline discussion · jo-lee · refresh.go:81</p><div class="comment"><strong>Could simultaneous requests race here?</strong><p>mira-k replied: Fixed with the per-session coordinator.</p></div><div class="compose"><label style="font-size:12px;font-weight:700">Add inline comment</label><textarea placeholder="Comment on this change…"></textarea><div class="actions"><button class="act primary" onclick="toast('Inline comment added in this prototype')">Submit comment</button></div></div></div>`}else{rows=`<div class="subhead" style="margin:3px 0 8px">All findings · select to inspect</div>${findingData.map((x,i)=>`<button class="findingpick ${i===findingIndex?'active':''}" onclick="findingIndex=${i};workspacePanel()"><span class="sev ${x[0]==='MEDIUM'?'med':''}">${x[0]}</span><small>${x[1]}</small><small>${x[2]}</small></button>`).join('')}`;detail=`<div class="detail-pane"><span class="sev ${f[0]==='MEDIUM'?'med':''}">${f[0]} · FINDING</span><h2>${f[1]}</h2><p>${f[3]}</p><div class="loc">${f[2]} · Standards</div><div class="detailcode"><div class="diffhead">Relevant code</div><div class="code"><span class="context">  if (!session.refreshToken) return err</span><span class="add">  next := coordinator.Run(session.ID, rotateToken)</span><span class="context">  store.Save(next)</span><span class="context">  return next, nil</span></div></div><div class="source-note">Discussion · grouped under Changes requested · jo-lee</div><div class="comment"><strong>Could simultaneous requests race here?</strong><p>mira-k replied: Fixed with the per-session coordinator.</p></div><div class="suggestion"><b>Suggested fix</b><p style="margin:5px 0;color:var(--muted)">Use the session coordinator so concurrent requests share one token rotation.</p><code>coordinator.Run(session.ID, rotateToken)</code><button class="act" onclick="toast('Suggested command copied in this prototype')">Use suggested command</button></div><div class="compose"><label style="font-size:12px;font-weight:700">Add finding comment</label><textarea placeholder="Add a review comment…"></textarea><div class="actions"><button class="act primary" onclick="toast('Comment added in this prototype')">Submit comment</button><button class="act" onclick="toast('Finding marked for follow-up in this prototype')">Mark for follow-up</button></div></div></div>`}document.querySelector('#workspace-nav').innerHTML=nav+rows;document.querySelector('#workspace-detail').innerHTML=detail}
function toast(message){let t=document.querySelector('#toast');t.textContent=message;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2000)}
function set(){document.querySelector('#app').innerHTML=({A,B,C}[variant])();document.querySelector('#label').textContent=variant+' — '+variants.find(v=>v[0]===variant)[1];const u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState({},'',u);if(variant==='C')renderMainTab()}function cycle(d){variant=variants[(variants.findIndex(v=>v[0]===variant)+d+3)%3][0];set()}document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});document.querySelector('#refresh').onclick=()=>{refreshState='Refreshed just now · demo data';set()};set();
</script></body></html>
